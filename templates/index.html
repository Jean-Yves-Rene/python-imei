{% extends "base.html" %}

{% block content %}

<h1>
    IMEI Check Warranty

    <span class="google-logo">
        <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
    </span>
</h1>

<br />

<form action="{{ url_for('warranty') }}" method="GET" onsubmit="return validateIMEI()">

    <input type="text" name="imei" id="imei" placeholder="Enter an IMEI" pattern="\d{15}" maxlength="15"
        inputmode="numeric" required autofocus title="Enter a valid 15-digit IMEI number" />

    <button type="submit">
        Submit
    </button>

</form>

<script>

    function luhnCheck(imei) {

        let sum = 0;
        let shouldDouble = false;

        for (let i = imei.length - 1; i >= 0; i--) {

            let digit = parseInt(
                imei.charAt(i),
                10
            );

            if (shouldDouble) {

                digit *= 2;

                if (digit > 9) {
                    digit -= 9;
                }
            }

            sum += digit;
            shouldDouble = !shouldDouble;
        }

        return sum % 10 === 0;
    }


    function validateIMEI() {

        let imei = document
            .getElementById("imei")
            .value
            .trim();

        if (!/^\d{15}$/.test(imei)) {

            alert(
                "Please enter a valid 15-digit IMEI number."
            );

            return false;
        }

        if (!luhnCheck(imei)) {

            alert(
                "Invalid IMEI number. Please check the number and try again."
            );

            return false;
        }

        return true;
    }

</script>

{% endblock %}
